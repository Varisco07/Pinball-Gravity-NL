<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050b13">
    <meta name="description" content="Gravity Pinball Challenge — un mini gioco ispirato al classico arcade con gravità, rimbalzi e livelli sempre più veloci." />
    <title>Gravity Pinball Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <style>
        :root {
            --bg: #0b1020;
            --panel: #101a2e;
            --panel-2: #121f34;
            --line: rgba(130, 180, 255, 0.65);
            --blue: #5ec7ff;
            --cyan: #8ef0ff;
            --green: #7dff9a;
            --red: #ff5e6b;
            --text: #edf6ff;
            --muted: #9bb7d8;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at top, rgba(30, 74, 140, 0.3), transparent 35%),
                linear-gradient(180deg, #0d0f16 0%, #171a24 100%);
            font-family: "DM Sans", sans-serif;
        }

        .game-shell {
            width: min(92vw, 760px);
            background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 0 0 3px rgba(78, 164, 255, 0.28), 0 28px 56px rgba(0, 0, 0, 0.45);
            padding: 18px 18px 14px;
        }

        .game-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 10px 12px 8px;
            border: 1px solid rgba(142, 203, 255, 0.3);
            border-radius: 12px;
            background: rgba(10, 16, 29, 0.85);
            color: var(--text);
            font-family: "Barlow Condensed", sans-serif;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .game-bar .left,
        .game-bar .right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .game-bar strong {
            color: var(--cyan);
            font-size: clamp(28px, 4vw, 42px);
            line-height: 1;
            text-shadow: 0 0 14px rgba(126, 221, 255, 0.7);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            border: 3px solid rgba(94, 199, 255, 0.8);
            border-radius: 10px;
            background: #000000;
            image-rendering: pixelated;
            box-shadow: inset 0 0 0 3px rgba(94, 199, 255, 0.2), 0 0 22px rgba(94, 199, 255, 0.2);
        }

        .game-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 6px 4px;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: .12em;
            font-size: 13px;
            font-weight: 700;
            font-family: "Barlow Condensed", sans-serif;
        }

        .game-status span:first-child {
            color: var(--text);
        }

        .game-status span:last-child {
            color: var(--blue);
            text-shadow: 0 0 10px rgba(94, 199, 255, 0.7);
        }

        .game-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .game-actions button {
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid rgba(130, 180, 255, 0.8);
            background: linear-gradient(180deg, rgba(17, 25, 39, 0.9), rgba(8, 13, 22, 0.95));
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: .08em;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .game-actions button:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 16px rgba(94, 199, 255, 0.23);
            border-color: rgba(142, 240, 255, 0.95);
        }

        .game-actions #resetToStartButton {
            border-color: rgba(255, 110, 110, 0.8);
            color: #ffd7d0;
            background: linear-gradient(180deg, rgba(38, 17, 21, 0.95), rgba(18, 10, 14, 0.95));
        }

        @media (max-width: 560px) {
            .game-shell {
                width: 96vw;
                padding: 12px 10px 8px;
            }

            .game-bar {
                gap: 10px;
                font-size: 10px;
            }

            .game-status {
                font-size: 11px;
                letter-spacing: .08em;
            }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="game-bar">
            <div class="left">
                <span>LEVEL</span>
                <strong id="levelDisplay">1</strong>
            </div>
            <div class="right">
                <span>SCORE</span>
                <strong id="scoreDisplay">0</strong>
            </div>
        </div>

        <canvas id="gameCanvas" width="640" height="540" aria-label="Gravity Pinball Challenge mini-game"></canvas>

        <div class="game-status">
            <span id="statusText">LEVEL 1</span>
            <span id="messageText">WAY TOO EASY</span>
        </div>

        <div class="game-actions">
            <button id="resetToStartButton" type="button">Torna all'inizio</button>
        </div>
    </div>
</body>
</html>
